
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Nicolly</title>
 
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
 
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fce4ec;
}
 
:root {
  --img-ratio: 2 / 3;
}
 
.stage {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
 
.screen-wrapper {
  position: relative;
  /* ocupa o máximo possível mantendo a proporção */
  aspect-ratio: var(--img-ratio);
  width: min(100%, calc(100vh * 2 / 3));
  height: auto;
  max-height: 100%;
  container-type: inline-size;
}
 
/* TELAS */
.screen {
  display: none;
  position: absolute;
  inset: 0;
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  border-radius: 4px;
  overflow: hidden;
}
/* Imagem de fundo via <img> para controle total */
.screen-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  pointer-events: none;
  user-select: none;
}
 
.active {
  display: block;
}
 
/* Botões — posicionados em % do wrapper, sem px fixo */
button {
  position: absolute;
  border: none;
  cursor: pointer;
  background: transparent;
  /* área de toque mínima para mobile */
  min-width: 44px;
  min-height: 44px;
}
 
/* ===== VÍDEO DE ENTRADA ===== */
.intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #fce4ec;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease;
}
.intro.hide {
  opacity: 0;
  pointer-events: none;
}
.intro video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.intro-btn {
  position: absolute;
  bottom: 5%;
  padding: 10px 20px;
  border-radius: 24px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(4px);
  color: #c2185b;
  font-size: 1em;
  font-family: Georgia, serif;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.intro-skip  { right: 5%; }
.intro-sound { left: 5%; display: none; }

/* ===== TELA 1 ===== */
#screen1 {
  background-image: url('imagemfundo01.jpeg');
}
 
.btn-open {
  /* centralizado horizontalmente, sobre o texto "Clique para abrir" */
  left: 50%;
  transform: translateX(-50%);
  top: 66%;
  width: 46%;
  height: 8%;
}
 
/* ===== TELA 2 ===== */
#screen2 {
  background-image: url('imagemfundo02.jpeg');
}
 
/* Os quatro botões ficam lado a lado, cobrindo ícone + legenda.
   Ajuste top/left/width conforme a sua arte. */
.btn-whatsapp,
.btn-maps,
.btn-dress,
.btn-gifts {
  top: 65%;
  height: 13%;
  width: 15%;
}
 
.btn-whatsapp { left: 14%; }
.btn-maps     { left: 33.5%; }
.btn-dress    { left: 50.5%; width: 17%; }
.btn-gifts    { left: 71%; }

/* Texto sobreposto: prazo de confirmação (cobre o "até 01/02" da arte) */
.rsvp-deadline {
  position: absolute;
  left: 22%;
  width: 56%;
  top: 88%;
  height: 2.8%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fbe2e7;
  /* bordas suaves para se misturar com o fundo */
  -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
          mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
  color: #c2185b;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 2.15cqw;
  white-space: nowrap;
  pointer-events: none;
}

/* ===== TELA 4 ===== */
#screen4 {
  background-image: url('imagemfundo04.jpeg');
}
 
/* ===== TELA 3 ===== */
#screen3 {
  background-image: url('imagemfundo03.jpeg');
}
 
.btn-back {
  left: 4%;
  top: 4%;
  width: 11%;
  height: 6%;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(4px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4em;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: background 0.2s, transform 0.15s;
  min-width: 44px;
  min-height: 44px;
}
 
/* ── Debug: borda vermelha nos botões para calibração ──
   Descomente para ver exatamente onde cada botão está.
   
button { outline: 2px solid red !important; }
*/
</style>
</head>
 
<body>
 
<div id="intro" class="intro">
  <video id="introVideo" src="videodeentrada.mp4" playsinline muted preload="auto"></video>
  <button id="introSound" class="intro-btn intro-sound">&#128266; Ativar som</button>
  <button id="introSkip" class="intro-btn intro-skip">Pular &#8250;</button>
</div>
 
<!-- Música de fundo: toca em loop durante o vídeo e em todas as telas do convite -->
<audio id="bgMusic" src="vidssave.com%20Jesus%20Meu%20Esposo%20-%20Instrumental%2048KBPS.mp3" loop preload="auto"></audio>

<div class="stage">
  <div class="screen-wrapper">
 
    <!-- TELA 1 -->
    <div id="screen1" class="screen active">
      <button class="btn-open" onclick="goTo(2)" aria-label="Abrir convite"></button>
    </div>
 
    <!-- TELA 2 -->
    <div id="screen2" class="screen">
      <button class="btn-whatsapp"
        onclick="window.open('https://wa.me/+559492094696')"
        aria-label="Confirmar presença pelo WhatsApp">
      </button>
 
      <button class="btn-maps"
        onclick="window.open('https://www.google.com/maps/place/Espa%C3%A7o+Garden+Festas+e+Eventos/@-8.0393514,-50.0263041,17z/data=!3m1!4b1!4m6!3m5!1s0x92e0070cd86660dd:0x5718e19a38b3e282!8m2!3d-8.0393514!4d-50.0263041!16s%2Fg%2F11l6r_8sq6?entry=ttu&g_ep=EgoyMDI2MDQyNi4wIKXMDSoASAFQAw%3D%3D')"
        aria-label="Ver local no mapa">
      </button>
 
      <button class="btn-dress"
        onclick="goTo(4)"
        aria-label="Ver informações sobre o traje">
      </button>
 
      <button class="btn-gifts"
        onclick="goTo(3)"
        aria-label="Ver lista de presentes">
      </button>

      <div class="rsvp-deadline">Por favor confirmar presença até 13/01</div>
    </div>
 
    <!-- TELA 3 -->
    <div id="screen3" class="screen">
      <button class="btn-back" onclick="goTo(2)" aria-label="Voltar">&#8592;</button>
    </div>
 
    <!-- TELA 4 -->
    <div id="screen4" class="screen">
      <button class="btn-back" onclick="goTo(2)" aria-label="Voltar">&#8592;</button>
    </div>
 
  </div>
</div>
 
<script>
const intro = document.getElementById('intro');
const introVideo = document.getElementById('introVideo');
const introSound = document.getElementById('introSound');
let introDone = false;

const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.8;

// Tenta tocar a música; navegadores podem bloquear som antes de um toque do usuário
function playMusic() {
  if (!bgMusic.paused) return Promise.resolve();
  return bgMusic.play().then(() => {
    introSound.style.display = 'none';
  });
}

// No primeiro toque/clique em qualquer lugar, garante que a música comece
function unlockMusic() {
  playMusic().catch(() => {});
}
['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt =>
  document.addEventListener(evt, unlockMusic, { passive: true })
);

// Ao voltar para o convite (ex.: depois de abrir WhatsApp ou Maps), retoma a música
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) playMusic().catch(() => {});
});

// O vídeo toca (sem som próprio) enquanto a música toca; ao terminar, mostra a tela 1
function startIntro() {
  introVideo.currentTime = 0;
  introVideo.muted = true;
  introVideo.play().catch(endIntro);
  playMusic().catch(() => {
    // Autoplay com som bloqueado: mostra o botão para ativar a música
    introSound.style.display = 'block';
  });
}

function endIntro() {
  if (introDone) return;
  introDone = true;
  introVideo.pause();
  goTo(1);
  intro.classList.add('hide');
  setTimeout(() => intro.remove(), 700);
}

introVideo.addEventListener('ended', endIntro);
introVideo.addEventListener('error', endIntro);
document.getElementById('introSkip').addEventListener('click', endIntro);
introSound.addEventListener('click', () => {
  playMusic().catch(() => {});
});

window.addEventListener('DOMContentLoaded', startIntro);

function goTo(screen) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen' + screen).classList.add('active');
}
</script>
 
</body>
</html>
